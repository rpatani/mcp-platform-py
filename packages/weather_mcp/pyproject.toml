[project]
name = "weather-mcp"
version = "0.1.0"
description = "Keyless weather MCP reference app built on mcp-platform-core."
requires-python = ">=3.11"
dependencies = [
  "mcp-platform-core",
  "httpx>=0.27,<1",
]

[project.scripts]
weather-mcp = "weather_mcp.server:main"

[tool.uv.sources]
mcp-platform-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_mcp"]
